<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Snowman</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: grid;
            place-items: center;
            background-color: #f5f5f5;
        }

        /* Container to hold canvas and absolute positioned text */
        .canvas-container {
            position: relative;
            display: inline-block;
        }

        #myDrawing {
            border: solid 1px green;
            background-color: #e3f2fd;
            display: block;
        }

        /* Styling for the rainbow text inside the canvas box */
        .rainbow-text {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 42px;
            font-weight: bold;
            font-family: 'Arial', sans-serif;
            text-align: center;
            pointer-events: none; /* Allows clicks to pass through to canvas if needed */
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
            letter-spacing: 2px;
            white-space: nowrap;
        }

        /* Adding proper spacing between MERRY and CHRISTMAS */
        .rainbow-text .space {
            display: inline-block;
            width: 15px;
        }
    </style>
</head>
<body>

    <div class="canvas-container">
        <!-- Rainbow text placed inside the canvas box -->
        <div class="rainbow-text">
            <span class="block-line">
                <span>
                    <span style="color:#ff0000">M</span><span style="color:#ff5500">E</span><span style="color:#ffaa00">R</span><span style="color:#ffff00">R</span><span style="color:#aaff00">Y</span>
                </span>
                <span class="space"></span>
                <span>
                    <span style="color:#55ff00">C</span><span style="color:#00ff00">H</span><span style="color:#00ff55">R</span><span style="color:#00ffaa">I</span><span style="color:#00ffff">S</span><span style="color:#00aaff">T</span><span style="color:#0055ff">M</span><span style="color:#0000ff">A</span><span style="color:#5500ff">S</span>
                </span>
            </span>
        </div>

        <canvas height="500" width="1000" id="myDrawing"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("myDrawing");
        const ctx = canvas.getContext("2d");
        const snowX = canvas.width / 2;

        
		function draw20BlueCircles() {
			for (let i=0; i < 20; i++) {
				// 1. Random X and Y position on the canvas
				const x=Math.random() * canvas.width;
				const y=Math.random() * canvas.height;
				// 2. Random size (radius from 5px to 30px)
				const radius=Math.random() * 10+1;
				// 3. Random shade of blue
				const hue=Math.floor(Math.random() * 40)+195;
				const lightness=Math.floor(Math.random() * 50)+35;
				ctx.fillStyle="hsl("+hue+", 85%, "+lightness+"%)";
				// 4. Draw the circle
				ctx.beginPath();
				ctx.arc(x, y, radius, 0, Math.PI * 2);
				ctx.fill();


			}

		}	

		draw20BlueCircles();

        ctx.beginPath();
        ctx.arc(snowX, 750, 350, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.strokeStyle = '#cfd8dc';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(snowX, 370, 75, 0, Math.PI * 2); 
        ctx.fillStyle = '#ffffff'; 
        ctx.fill();
        ctx.strokeStyle = '#b0bec5';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(snowX, 275, 55, 0, Math.PI * 2); 
        ctx.fillStyle = '#ffffff'; 
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(snowX, 200, 38, 0, Math.PI * 2); 
        ctx.fillStyle = '#ffffff'; 
        ctx.fill();
        ctx.stroke();

      

        const buttons = [255, 275, 295];
        buttons.forEach(yCoord => {
            ctx.beginPath();
            ctx.arc(snowX, yCoord, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#37474f';
            ctx.fill();
        });
   
        // Eyes
        ctx.beginPath();
        ctx.arc(snowX - 10, 190, 4, 0, Math.PI * 2);
        ctx.arc(snowX + 10, 190, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#37474f';
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(snowX, 200);
        ctx.lineTo(snowX + 25, 205);
        ctx.lineTo(snowX, 210);
        ctx.fillStyle = '#ff9800';
        ctx.fill();
        ctx.strokeStyle = '#f57c00';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(snowX, 200, 18, 0.1 * Math.PI, 0.9 * Math.PI);
        ctx.strokeStyle = '#37474f';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(snowX - 30, 162);
        ctx.lineTo(snowX + 30, 162);
        ctx.strokeStyle = '#263238';
        ctx.lineWidth = 6;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(snowX - 18, 162);
        ctx.lineTo(snowX - 18, 115);
        ctx.lineTo(snowX + 18, 115);
        ctx.lineTo(snowX + 18, 162);
        ctx.fillStyle = '#263238';
        ctx.fill();
        ctx.stroke();
    </script>
</body>
</html>
